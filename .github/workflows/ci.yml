name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tests
        run: python -m pip install -e ".[test]"

      - name: Run Python tests
        run: python -m pytest -q

  package:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tools
        run: python -m pip install build twine

      - name: Install project metadata
        run: python -m pip install -e . --no-deps

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          expected_version="$(python -c 'from importlib.metadata import version; print(version("mcp-workers-bridge"))')"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from importlib.metadata import entry_points, version; import sys; assert version('mcp-workers-bridge') == sys.argv[1]; assert any(ep.name == 'mcp-workers-bridge' for ep in entry_points(group='console_scripts'))" "${expected_version}"

      - name: Store package distributions
        uses: actions/upload-artifact@v5
        with:
          name: ci-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
