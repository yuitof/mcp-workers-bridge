[mcp_servers.workers-bridge-cloud]
command = "/bin/bash"
args = [
  "-c",
  "set -euo pipefail; for candidate in \"$(git rev-parse --show-toplevel 2>/dev/null || true)\" \"$PWD\" \"$PWD/mcp-workers-bridge\"; do if [ -n \"$candidate\" ] && [ -x \"$candidate/.venv/bin/mcp-workers-bridge\" ]; then cd \"$candidate\"; exec \"$candidate/.venv/bin/mcp-workers-bridge\"; fi; done; echo \"mcp-workers-bridge launcher not found\" >&2; exit 1"
]
startup_timeout_sec = 30
tool_timeout_sec = 300
env = { PYTHONUNBUFFERED = "1" }
env_vars = [
  "SERVICE_BRIDGE_WORKER_URL",
  "CF_ACCESS_CLIENT_ID",
  "CF_ACCESS_CLIENT_SECRET",
  "YOUTUBE_STORAGE_STATE_JSON",
  "YOUTUBE_TIMEZONE",
  "YOUTUBE_CACHE_DIR",
  "YOUTUBE_CACHE_BUCKET",
  "X_STORAGE_STATE_JSON",
  "REDDIT_STORAGE_STATE_JSON",
  "AWS_REGION",
  "AWS_PROFILE",
  "AWS_CONFIG_FILE",
  "AWS_SHARED_CREDENTIALS_FILE",
  "AWS_WEB_IDENTITY_TOKEN_FILE",
  "AWS_ROLE_ARN",
  "REQUESTS_CA_BUNDLE",
  "CURL_CA_BUNDLE",
  "SSL_CERT_FILE",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY"
]
