[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-workers-bridge"
version = "0.1.0"
description = "MCP server for the Cloudflare Workers and legacy AWS service bridges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml==0.7.1",
  "mcp==1.30.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
mcp-workers-bridge = "mcp_workers_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
